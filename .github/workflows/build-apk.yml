name: Project Canvas Android Build

on:
  push:
    branches: [main, fix/tgl-extra-namespace-v2
      - android-linker-strategy-a]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight
        working-directory: android
        shell: bash
        run: |
          set -euxo pipefail
          pwd
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/cpp/CMakeLists.txt
          echo "Android project detected"

      - name: Fetch native compatibility dependencies
        working-directory: android
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 https://github.com/ptitSeb/gl4es.git app/src/main/cpp/gl4es
          git -C app/src/main/cpp/gl4es fetch --depth 1 origin 81547d986798e876de8b434193920b606a72363f
          git -C app/src/main/cpp/gl4es checkout 81547d986798e876de8b434193920b606a72363f
          grep -q 'if(ANDROID)' app/src/main/cpp/gl4es/CMakeLists.txt

          curl -L --fail https://archive.mesa3d.org/glu/glu-9.0.3.tar.xz -o /tmp/glu-9.0.3.tar.xz
          tar -xJf /tmp/glu-9.0.3.tar.xz -C app/src/main/cpp
          mv app/src/main/cpp/glu-9.0.3 app/src/main/cpp/glu
          test -d app/src/main/cpp/glu/src

          curl -L --fail https://archives.boost.io/release/1.85.0/source/boost_1_85_0.tar.gz -o /tmp/boost_1_85_0.tar.gz
          tar -xzf /tmp/boost_1_85_0.tar.gz -C app/src/main/cpp
          mv app/src/main/cpp/boost_1_85_0 app/src/main/cpp/boost
          test -f app/src/main/cpp/boost/boost/config.hpp
          test -f app/src/main/cpp/boost/boost/range.hpp

          git clone --depth 1 --branch v1.9.4 https://github.com/lz4/lz4.git app/src/main/cpp/lz4
          test -f app/src/main/cpp/lz4/lib/lz4frame.h
          test -f app/src/main/cpp/lz4/build/cmake/CMakeLists.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: project-canvas-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
