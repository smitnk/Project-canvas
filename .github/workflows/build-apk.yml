name: Project Canvas Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch real OpenGL compatibility sources
        run: |
          git clone --depth 1 https://github.com/ptitSeb/gl4es.git app/src/main/cpp/gl4es
          git -C app/src/main/cpp/gl4es fetch --depth 1 origin 81547d986798e876de8b434193920b606a72363f
          git -C app/src/main/cpp/gl4es checkout 81547d986798e876de8b434193920b606a72363f
          git clone --depth 1 --branch v3.8.0 https://github.com/freeglut/freeglut.git app/src/main/cpp/freeglut
          git -C app/src/main/cpp/freeglut checkout 3db1649ce1f5e42f1338b51e3fa14849be547d5d
          python3 -c 'from pathlib import Path; p=Path("app/src/main/cpp/freeglut/src/android/native_app_glue/android_native_app_glue.c"); s=p.read_text(); needle="#include <errno.h>\n"; assert needle in s; s=s.replace(needle, needle+"#include <stdlib.h>\n", 1); p.write_text(s)'
          python3 -c 'from pathlib import Path; p=Path("app/src/main/cpp/freeglut/src/android/fg_main_android.c"); s=p.read_text(); s2=s.replace("ALooper_pollAll(", "ALooper_pollOnce("); assert s2 != s; p.write_text(s2)'
          python3 -c 'from pathlib import Path; p=Path("app/src/main/cpp/freeglut/include/GL/freeglut_std.h"); s=p.read_text(); s=s.replace("#   include <EGL/egl.h>\\n#   include <GLES/gl.h>\\n#   include <GLES2/gl2.h>", "#   include <EGL/egl.h>\\n#   include <GL/gl.h>"); p.write_text(s)'
          python3 -c 'from pathlib import Path; p=Path("app/src/main/cpp/freeglut/include/GL/freeglut_std.h"); s=p.read_text(); s=s.replace("#   include <GLES2/gl2.h>", "#   include <GL/gl.h>"); p.write_text(s)'
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/cpp/freeglut/CMakeLists.txt")
          s = p.read_text()
          s = s.replace(
              "        src/gles_stubs.c\n",
              "        src/fg_font.c\n        src/fg_menu.c\n",
              1,
          )
          start = s.index("# For OpenGL ES (GLES):")
          end = s.index("# For Wayland:", start)
          block = """# For OpenGL ES (GLES): Android uses the real EGL backend.
          IF(FREEGLUT_GLES)
              LIST(APPEND PUBLIC_DEFINITIONS -DFREEGLUT_GLES)
              if(ANDROID)
                find_library(_FG_EGL_LIBRARY EGL REQUIRED)
                find_library(_FG_GLES2_LIBRARY GLESv2 REQUIRED)
                find_library(_FG_GLES1_LIBRARY GLESv1_CM)
                LIST(APPEND LIBS ${_FG_GLES1_LIBRARY} ${_FG_EGL_LIBRARY} ${_FG_GLES2_LIBRARY})
              elseif(NOT CMAKE_VERSION VERSION LESS "3.27")
                FIND_PACKAGE(OpenGL REQUIRED COMPONENTS EGL GLES2 OpenGL)
                CMAKE_PATH(GET OPENGL_gles2_LIBRARY PARENT_PATH _OPENGL_LIBDIR)
                FIND_LIBRARY(GLES1_LIBRARY GLESv1_CM HINTS ${_OPENGL_LIBDIR} REQUIRED)
                LIST(APPEND LIBS ${GLES1_LIBRARY} OpenGL::EGL OpenGL::GLES2 OpenGL::OpenGL)
              else()
                FIND_PACKAGE(OpenGL REQUIRED COMPONENTS EGL OpenGL)
                GET_FILENAME_COMPONENT(_OPENGL_LIBDIR ${OPENGL_egl_LIBRARY} DIRECTORY)
                FIND_LIBRARY(GLES1_LIBRARY GLESv1_CM HINTS ${_OPENGL_LIBDIR})
                FIND_LIBRARY(GLES2_LIBRARY GLESv2 HINTS ${_OPENGL_LIBDIR})
                LIST(APPEND LIBS ${GLES1_LIBRARY} ${GLES2_LIBRARY} OpenGL::EGL OpenGL::OpenGL)
              endif()
          ENDIF()

          """
          p.write_text(s[:start] + block + s[end:])
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: project-canvas-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
