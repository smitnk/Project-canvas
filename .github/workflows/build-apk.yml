name: Project Canvas Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight
        working-directory: android
        shell: bash
        run: |
          set -euxo pipefail
          pwd
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/cpp/CMakeLists.txt
          echo "Android project detected"

      - name: Fetch real OpenGL compatibility sources
        working-directory: android
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ptitSeb/gl4es.git app/src/main/cpp/gl4es
          git -C app/src/main/cpp/gl4es fetch --depth 1 origin 81547d986798e876de8b434193920b606a72363f
          git -C app/src/main/cpp/gl4es checkout 81547d986798e876de8b434193920b606a72363f
          grep -q 'if(ANDROID)' app/src/main/cpp/gl4es/CMakeLists.txt

          git clone --depth 1 --branch v3.8.0 https://github.com/freeglut/freeglut.git app/src/main/cpp/freeglut
          git -C app/src/main/cpp/freeglut checkout 3db1649ce1f5e42f1338b51e3fa14849be547d5d

          curl -L --fail https://archive.mesa3d.org/glu/glu-9.0.3.tar.xz -o /tmp/glu-9.0.3.tar.xz
          tar -xJf /tmp/glu-9.0.3.tar.xz -C app/src/main/cpp
          mv app/src/main/cpp/glu-9.0.3 app/src/main/cpp/glu

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/cpp/freeglut/src/android/native_app_glue/android_native_app_glue.c")
          s = p.read_text()
          if "#include <stdlib.h>" not in s:
              s = s.replace("#include <errno.h>\n", "#include <errno.h>\n#include <stdlib.h>\n", 1)
          p.write_text(s)

          p = Path("app/src/main/cpp/freeglut/src/android/fg_main_android.c")
          s = p.read_text()
          s = s.replace("ALooper_pollAll(", "ALooper_pollOnce(")
          p.write_text(s)

          p = Path("app/src/main/cpp/freeglut/include/GL/freeglut_std.h")
          s = p.read_text()
          s = s.replace("#   include <EGL/egl.h>\n#   include <GLES/gl.h>\n#   include <GLES2/gl2.h>",
                        "#   include <EGL/egl.h>\n#   include <GL/gl.h>")
          s = s.replace("#   include <GLES2/gl2.h>", "#   include <GL/gl.h>")
          p.write_text(s)

          p = Path("app/src/main/cpp/freeglut/CMakeLists.txt")
          s = p.read_text()
          s = s.replace("        src/gles_stubs.c\n", "        src/fg_font.c\n        src/fg_menu.c\n", 1)
          s = s.replace("IF(FREEGLUT_GLES OR FREEGLUT_WAYLAND)",
                        "IF(FREEGLUT_GLES OR ANDROID OR FREEGLUT_WAYLAND)", 1)
          old = """    if(NOT CMAKE_VERSION VERSION LESS "3.10")
      FIND_PACKAGE(OpenGL REQUIRED COMPONENTS OpenGL)
      LIST(APPEND LIBS OpenGL::GL)
    else()
      FIND_PACKAGE(OpenGL REQUIRED)
      LIST(APPEND LIBS ${OPENGL_gl_LIBRARY})
      INCLUDE_DIRECTORIES(${OPENGL_INCLUDE_DIR})
    endif()

    if(NOT CMAKE_SYSTEM_NAME STREQUAL "Windows")
      # CMake 3.29 properly locates the include directory for glu.h in the OPENGL_GLU_INCLUDE_DIR variable for us.
      if(CMAKE_VERSION VERSION_LESS "3.29")
        FIND_PATH(OPENGL_GLU_INCLUDE_DIR NAMES GL/glu.h OpenGL/glu.h HINTS ${OPENGL_INCLUDE_DIR})
      endif()
      if(NOT OPENGL_GLU_INCLUDE_DIR)
        message(FATAL_ERROR "Failed to find the glu.h header file.")
      endif()
      INCLUDE_DIRECTORIES(${OPENGL_GLU_INCLUDE_DIR})
    endif()"""
          new = """    if(ANDROID)
      LIST(APPEND LIBS GL)
    elseif(NOT CMAKE_VERSION VERSION LESS "3.10")
      FIND_PACKAGE(OpenGL REQUIRED COMPONENTS OpenGL)
      LIST(APPEND LIBS OpenGL::GL)
    else()
      FIND_PACKAGE(OpenGL REQUIRED)
      LIST(APPEND LIBS ${OPENGL_gl_LIBRARY})
      INCLUDE_DIRECTORIES(${OPENGL_INCLUDE_DIR})
    endif()

    if(NOT ANDROID AND NOT CMAKE_SYSTEM_NAME STREQUAL "Windows")
      if(CMAKE_VERSION VERSION_LESS "3.29")
        FIND_PATH(OPENGL_GLU_INCLUDE_DIR NAMES GL/glu.h OpenGL/glu.h HINTS ${OPENGL_INCLUDE_DIR})
      endif()
      if(NOT OPENGL_GLU_INCLUDE_DIR)
        message(FATAL_ERROR "Failed to find the glu.h header file.")
      endif()
      INCLUDE_DIRECTORIES(${OPENGL_GLU_INCLUDE_DIR})
    endif()"""
          if old not in s:
              raise SystemExit("Expected FreeGLUT CMake block was not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: project-canvas-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
