name: Project Canvas Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch real OpenGL compatibility sources
        run: |
          git clone --depth 1 https://github.com/ptitSeb/gl4es.git app/src/main/cpp/gl4es
          git -C app/src/main/cpp/gl4es fetch --depth 1 origin 81547d986798e876de8b434193920b606a72363f
          git -C app/src/main/cpp/gl4es checkout 81547d986798e876de8b434193920b606a72363f
          git clone --depth 1 --branch v3.8.0 https://github.com/freeglut/freeglut.git app/src/main/cpp/freeglut
          git -C app/src/main/cpp/freeglut checkout 3db1649ce1f5e42f1338b51e3fa14849be547d5d
          python3 -c 'from pathlib import Path; import re; p=Path("app/src/main/cpp/freeglut/CMakeLists.txt"); s=p.read_text(); pat=r"IF\(FREEGLUT_GLES\)\n    LIST\(APPEND PUBLIC_DEFINITIONS -DFREEGLUT_GLES\)\n    if\(NOT CMAKE_VERSION VERSION LESS \"3\\.27\"\).*?    endif\(\)"; m=re.search(pat,s,re.S); assert m, "FreeGLUT GLES dependency block not found"; block="IF(FREEGLUT_GLES)\n    LIST(APPEND PUBLIC_DEFINITIONS -DFREEGLUT_GLES)\n    if(ANDROID)\n      find_library(_FG_EGL_LIBRARY EGL REQUIRED)\n      find_library(_FG_GLES2_LIBRARY GLESv2 REQUIRED)\n      find_library(_FG_GLES1_LIBRARY GLESv1_CM)\n      LIST(APPEND LIBS ${_FG_GLES1_LIBRARY} ${_FG_EGL_LIBRARY} ${_FG_GLES2_LIBRARY})\n    elseif(NOT CMAKE_VERSION VERSION LESS \"3.27\")\n      FIND_PACKAGE(OpenGL REQUIRED COMPONENTS EGL GLES2 OpenGL)\n      CMAKE_PATH(GET OPENGL_gles2_LIBRARY PARENT_PATH _OPENGL_LIBDIR)\n      FIND_LIBRARY(GLES1_LIBRARY GLESv1_CM HINTS ${_OPENGL_LIBDIR} REQUIRED)\n      LIST(APPEND LIBS ${GLES1_LIBRARY} OpenGL::EGL OpenGL::GLES2 OpenGL::OpenGL)\n    else()\n      FIND_PACKAGE(OpenGL REQUIRED COMPONENTS EGL OpenGL)\n      GET_FILENAME_COMPONENT(_OPENGL_LIBDIR ${OPENGL_egl_LIBRARY} DIRECTORY)\n      FIND_LIBRARY(GLES1_LIBRARY GLESv1_CM HINTS ${_OPENGL_LIBDIR})\n      FIND_LIBRARY(GLES2_LIBRARY GLESv2 HINTS ${_OPENGL_LIBDIR})\n      LIST(APPEND LIBS ${GLES1_LIBRARY} ${GLES2_LIBRARY} OpenGL::EGL OpenGL::OpenGL)\n    endif()"; p.write_text(s[:m.start()]+block+s[m.end():])'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: project-canvas-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
